[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "flipkart-ecommerce-decision-intelligence"
version = "1.0.0"
description = "Flipkart E-Commerce Decision Intelligence Capstone Project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gaurav Chakraborty" }
]
dependencies = [
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
